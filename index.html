<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bridgeland Line Finder</title>
<style>
:root {
  --navy:#17365D;
  --blue:#2F5597;
  --bg:#F5F7FA;
  --card:#FFFFFF;
  --border:#D8DEE6;
  --muted:#667085;
  --day:#D9EAF7;
  --evening:#FCE4C8;
  --night:#D8D0EA;
  --off:#F1F3F5;
  --green:#DCEAD5;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:#1F2937;
}
.hero {
  background:linear-gradient(135deg,var(--navy),var(--blue));
  color:white;
  padding:28px 18px 24px;
}
.wrap {
  width:min(1120px,calc(100% - 28px));
  margin:0 auto;
}
.hero h1 {
  margin:0 0 6px;
  font-size:clamp(28px,5vw,46px);
  line-height:1.05;
}
.hero p {
  margin:0;
  opacity:.92;
  max-width:760px;
}
.panel {
  margin-top:-14px;
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  box-shadow:0 10px 30px rgba(23,54,93,.10);
}
.filters {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
label {
  display:block;
  font-size:12px;
  font-weight:700;
  color:#475467;
  margin-bottom:6px;
}
select {
  width:100%;
  padding:12px 13px;
  border:1px solid #C9D2DC;
  border-radius:10px;
  background:white;
  font-size:15px;
}
select:disabled {
  background:#F2F4F7;
  color:#98A2B3;
}
.actions {
  margin-top:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.count {
  font-weight:800;
  color:var(--navy);
}
button {
  border:none;
  background:#E9EEF5;
  color:var(--navy);
  border-radius:10px;
  padding:10px 14px;
  font-weight:700;
  cursor:pointer;
}
.results {
  padding:24px 0 44px;
}
.empty {
  background:white;
  border:1px dashed #B8C2CC;
  border-radius:16px;
  padding:30px;
  text-align:center;
  color:var(--muted);
}
.card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  margin-bottom:18px;
  overflow:hidden;
  box-shadow:0 4px 14px rgba(0,0,0,.05);
}
.cardhead {
  background:var(--blue);
  color:white;
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.cardhead h3 {
  margin:0;
  font-size:20px;
}
.meta {
  font-size:13px;
  opacity:.95;
}
.tablewrap { overflow-x:auto; }
table {
  border-collapse:collapse;
  width:100%;
  min-width:760px;
}
th,td {
  border:1px solid #D6DDE5;
  text-align:center;
  padding:10px 8px;
  font-size:13px;
}
th {
  background:#E8EEF7;
  color:#344054;
}
.week {
  background:#EEF2F7;
  font-weight:800;
  white-space:nowrap;
}
.shift-day { background:var(--day); }
.shift-evening { background:var(--evening); }
.shift-night { background:var(--night); }
.shift-off { background:var(--off); color:#667085; }
.shift-weekend { background:var(--green); }
.legend {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:10px;
  font-size:12px;
  color:#475467;
}
.legend span {
  display:inline-flex;
  gap:6px;
  align-items:center;
}
.dot {
  width:13px;height:13px;border-radius:3px;border:1px solid #C6CCD3;
}
.note {
  padding:11px 16px 14px;
  color:#667085;
  font-size:12px;
}
.role-pill {
  display:inline-block;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.22);
  border-radius:999px;
  padding:4px 9px;
  margin-left:6px;
}

.hero-row {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
}
.hero-link {
  display:inline-block;
  flex:0 0 auto;
  color:white;
  text-decoration:none;
  font-weight:800;
  border:1px solid rgba(255,255,255,.38);
  background:rgba(255,255,255,.12);
  border-radius:10px;
  padding:10px 14px;
  transition:background .2s ease;
}
.hero-link:hover { background:rgba(255,255,255,.22); }
@media (max-width:620px) {
  .hero-row { flex-direction:column; }
}
@media (max-width:820px) {
  .filters { grid-template-columns:1fr 1fr; }
}
@media (max-width:520px) {
  .wrap { width:min(100% - 18px,1120px); }
  .filters { grid-template-columns:1fr; }
  .panel { padding:14px;border-radius:14px; }
  .cardhead h3 { font-size:18px; }
}
</style>
</head>
<body>
<section class="hero">
  <div class="wrap hero-row">
    <div>
      <h1>Bridgeland Line Finder</h1>
      <p>Choose your position, floor, FTE and shift combination to view the matching 5-week line schedules.</p>
    </div>
    <a class="hero-link" href="decision-criteria.html">Decision Criteria</a>
  </div>
</section>

<main class="wrap">
  <section class="panel">
    <div class="filters">
      <div>
        <label for="position">Position *</label>
        <select id="position">
          <option value="">Select position</option>
          <option value="HCA">HCA</option>
          <option value="LPN">LPN</option>
          <option value="RN">RN</option>
        </select>
      </div>

      <div>
        <label for="floor">Floor *</label>
        <select id="floor">
          <option value="">Select floor</option>
          <option value="Level 2">Level 2</option>
          <option value="Level 4">Level 4</option>
          <option value="Level 5">Level 5</option>
        </select>
      </div>

      <div>
        <label for="fte">FTE *</label>
        <select id="fte" disabled>
          <option value="">Select position and floor first</option>
        </select>
      </div>

      <div>
        <label for="shift">Shift Combination *</label>
        <select id="shift" disabled>
          <option value="">Select FTE first</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <div id="count" class="count">Choose all 4 filters to view lines.</div>
      <button id="reset" type="button">Reset filters</button>
    </div>

    <div class="legend">
      <span><i class="dot" style="background:var(--day)"></i> Day</span>
      <span><i class="dot" style="background:var(--evening)"></i> Evening</span>
      <span><i class="dot" style="background:var(--night)"></i> Night</span>
      <span><i class="dot" style="background:var(--off)"></i> Off / x</span>
      <span><i class="dot" style="background:var(--green)"></i> Weekend marker (~)</span>
    </div>
  </section>

  <section id="results" class="results">
    <div class="empty">Select the required options above to view matching lines.</div>
  </section>
</main>

const positionEl=document.getElementById('position');
const floorEl=document.getElementById('floor');
const fteEl=document.getElementById('fte');
const shiftEl=document.getElementById('shift');
const resultsEl=document.getElementById('results');
const countEl=document.getElementById('count');
const resetEl=document.getElementById('reset');

const shiftNames={
  "D":"Days",
  "E":"Evenings",
  "N":"Nights",
  "D/E":"Days / Evenings",
  "D/N":"Days / Nights",
  "E/N":"Evenings / Nights",
  "D/E/N":"Days / Evenings / Nights"
};

function uniqueSorted(values,numeric=false) {
  const vals=[...new Set(values)];
  return numeric ? vals.sort((a,b)=>Number(b)-Number(a)) : vals.sort();
}

function refreshFTEs() {
  const pos=positionEl.value;
  const floor=floorEl.value;
  const current=fteEl.value;

  if(!(pos && floor)) {
    fteEl.disabled=true;
    fteEl.innerHTML='<option value="">Select position and floor first</option>';
    return;
  }

  const vals=uniqueSorted(
    rotations.filter(r=>r.position===pos && r.floor===floor).map(r=>String(r.fte)),
    true
  );

  fteEl.disabled=false;
  fteEl.innerHTML='<option value="">Select FTE</option>' +
    vals.map(v=>`<option value="${v}">${Number(v).toFixed(1)}</option>`).join('');

  if(vals.includes(current)) fteEl.value=current;
}

function refreshShifts() {
  const pos=positionEl.value;
  const floor=floorEl.value;
  const fte=fteEl.value;
  const current=shiftEl.value;

  if(!(pos && floor && fte)) {
    shiftEl.disabled=true;
    shiftEl.innerHTML='<option value="">Select FTE first</option>';
    return;
  }

  const vals=uniqueSorted(
    rotations.filter(r=>r.position===pos && r.floor===floor && String(r.fte)===fte)
             .map(r=>r.lineType)
  );

  shiftEl.disabled=false;
  shiftEl.innerHTML='<option value="">Select shift</option>' +
    vals.map(v=>`<option value="${v}">${shiftNames[v]||v}</option>`).join('');

  if(vals.includes(current)) shiftEl.value=current;
}

function cellClass(code) {
  if(!code || code==="6") return 'shift-off';
  if(code.includes('N')) return 'shift-night';
  if(code.includes('E')) return 'shift-evening';
  if(code.includes('D')) return 'shift-day';
  if(code.includes('~')) return 'shift-weekend';
  if(code.includes('x')) return 'shift-off';
  return '';
}

function displayCode(code) {
  if(!code || code==="6") return 'OFF';
  return code;
}

function card(r) {
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const rows=r.weeks.map((week,i)=>`
    <tr>
      <td class="week">Week ${i+1}</td>
      ${week.map(code=>`<td class="${cellClass(code)}">${displayCode(code)}</td>`).join('')}
    </tr>`).join('');

  return `
    <article class="card">
      <div class="cardhead">
        <div>
          <h3>Line ${r.rotation} <span class="role-pill">${r.position}</span></h3>
          <div class="meta">${r.fte.toFixed(1)} FTE · ${r.hours} biweekly hours · ${shiftNames[r.lineType]||r.lineType}</div>
        </div>
        <div class="meta">${r.floor}</div>
      </div>

      <div class="tablewrap">
        <table>
          <thead>
            <tr><th>Week</th>${days.map(d=>`<th>${d}</th>`).join('')}</tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>

      <div class="note">5-week repeating cycle. After Week 5, return to Week 1. Line codes are preserved from the approved master schedule.</div>
    </article>`;
}

function render() {
  const pos=positionEl.value;
  const floor=floorEl.value;
  const fte=fteEl.value;
  const shift=shiftEl.value;

  if(!(pos && floor && fte && shift)) {
    countEl.textContent='Choose all 4 filters to view lines.';
    resultsEl.innerHTML='<div class="empty">Select the required options above to view matching lines.</div>';
    return;
  }

  const matches=rotations.filter(r =>
    r.position===pos &&
    r.floor===floor &&
    String(r.fte)===fte &&
    r.lineType===shift
  );

  countEl.textContent=`${matches.length} matching rotation${matches.length===1?'':'s'}`;
  resultsEl.innerHTML=matches.length
    ? matches.map(card).join('')
    : '<div class="empty">No rotations match those filters. Try another FTE or shift combination.</div>';
}

function resetAfterPrimaryChange() {
  fteEl.value='';
  shiftEl.value='';
  refreshFTEs();
  refreshShifts();
  render();
}

positionEl.addEventListener('change', resetAfterPrimaryChange);
floorEl.addEventListener('change', resetAfterPrimaryChange);

fteEl.addEventListener('change',()=>{
  shiftEl.value='';
  refreshShifts();
  render();
});

shiftEl.addEventListener('change',render);

resetEl.addEventListener('click',()=>{
  positionEl.value='';
  floorEl.value='';
  fteEl.disabled=true;
  fteEl.innerHTML='<option value="">Select position and floor first</option>';
  shiftEl.disabled=true;
  shiftEl.innerHTML='<option value="">Select FTE first</option>';
  render();
});

render();
</script>
